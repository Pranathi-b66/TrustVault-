spring.application.name=trustvault
server.port=8088

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/trustvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2006hlkp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# STRICT REQUIREMENT: Must be validate to protect custom MySQL WORM audit_logs triggers
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload Specs
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Zero-Trust Specs
trustvault.jwt.secret=TrustVaultSuperSecureSecretKeyForZeroTrustJWTTokenGeneration2025!
trustvault.jwt.expiration-ms=86400000

# File Storage Specification
trustvault.upload.dir=uploads

# WebAuthn Specification
trustvault.webauthn.rp-id=localhost
trustvault.webauthn.rp-name=TrustVault
trustvault.webauthn.origin=http://localhost:8088
