spring.application.name=trustvault
server.port=8088

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/trustvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2006hlkp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# STRICT REQUIREMENT: Must be validate to protect custom MySQL WORM audit_logs triggers
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload Specs
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Zero-Trust Specs
trustvault.jwt.secret=TrustVaultSuperSecureSecretKeyForZeroTrustJWTTokenGeneration2025!
trustvault.jwt.expiration-ms=86400000

# File Storage Specification
trustvault.upload.dir=uploads

# Webcam FaceID Specification (client-side face-api.js, server-side L2 matching)
# Minimum similarity in [0,1] (1 - euclidean distance) required to accept a live capture;
# also used to block a face that is already bound to another account. 0.40 == distance 0.60.
trustvault.face.match-threshold=0.40
# Maximum number of enrollments compared during a duplicate enrollment scan.
trustvault.face.max-candidates=5000
# Dimension of the embedding produced by FaceRecognitionNet (face-api.js).
trustvault.face.descriptor-size=128
# Key used to seal stored face descriptors with AES-256-GCM (rotate by re-enrolling identities).
trustvault.face.encryption-key=TrustVaultFaceDescriptorSealingKey2026!
