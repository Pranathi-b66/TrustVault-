spring.application.name=trustvault
# Render (and most PaaS hosts) inject the public port as PORT; local runs keep 8088.
server.port=${PORT:8088}

# Database Configuration (MySQL on Aiven)
# sslMode=REQUIRED encrypts the session without requiring a local CA truststore.
spring.datasource.url=jdbc:mysql://mysql-3494e395-jr1a1209-9dfa.j.aivencloud.com:28942/trustvault?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=avnadmin
# The credential is read from the environment and must never be committed here.
spring.datasource.password=${TRUSTVAULT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
# STRICT REQUIREMENT: Must be validate to protect custom MySQL WORM audit_logs triggers
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload Specs
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# JWT Zero-Trust Specs
trustvault.jwt.secret=TrustVaultSuperSecureSecretKeyForZeroTrustJWTTokenGeneration2025!
trustvault.jwt.expiration-ms=86400000

# Demo bootstrap. Disabled: a purged database must stay empty across restarts, and the first
# identity is created through the FaceID sign-up flow. Enable only for a local showcase.
trustvault.bootstrap.seed-default-users=false

# File Storage Specification
trustvault.upload.dir=uploads

# Webcam FaceID Specification (client-side face-api.js, server-side L2 matching)
# Minimum similarity in [0,1] (1 - euclidean distance) required to treat two captures as the
# SAME FACE during enrollment. Used only by the duplicate-enrollment scan; identity decisions on
# verify-face are made on the strict distance ceiling below. 0.40 == distance 0.60.
trustvault.face.match-threshold=0.40
# Strict identity threshold: the euclidean distance between the live probe and the enrolled
# template must be <= 0.60. That is the reference operating point of FaceRecognitionNet, which
# places two captures of the same face 0.4-0.6 apart; a lower value rejects genuine users. The
# property can only tighten the value; the 0.60 ceiling is hard.
trustvault.face.verify-max-distance=0.60
# Lifetime of the single-use, timestamped challenge minted before a webcam capture.
# Values above 30 seconds are clamped to 30 by BiometricChallengeService.
trustvault.face.challenge-ttl-seconds=30
# Permitted clock drift between minting and redeeming a challenge.
trustvault.face.challenge-clock-skew-seconds=5
# Maximum number of enrollments compared during a duplicate enrollment scan.
trustvault.face.max-candidates=5000
# Dimension of the embedding produced by FaceRecognitionNet (face-api.js).
trustvault.face.descriptor-size=128
# Key used to seal stored face descriptors with AES-256-GCM (rotate by re-enrolling identities).
trustvault.face.encryption-key=TrustVaultFaceDescriptorSealingKey2026!
