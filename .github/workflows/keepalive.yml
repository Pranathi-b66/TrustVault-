name: Keep Render backend warm

# The backend runs on Render's free plan, which sleeps after 15 minutes without
# traffic and then needs ~2.5 minutes to boot. Vercel's proxy gives up long
# before that, so an idle backend surfaces as a 502 in the browser. Pinging every
# 10 minutes keeps the instance inside its wake window.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -sS --max-time 180 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            https://trustvault-jy4j.onrender.com/favicon.svg || true
